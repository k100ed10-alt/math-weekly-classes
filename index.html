<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>حصص الرياضيات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=14" />
  <style>
    .yt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .yt-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;background:#000}
    .yt-wrap iframe,.yt-wrap #ytApi{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
    .yt-cover{position:absolute;inset:0;z-index:5;border:0;background:rgba(7,20,40,.55);color:#fff;font:700 1.1rem Cairo,Tahoma,sans-serif;cursor:pointer}
    .yt-cover.hidden{display:none}
  </style>
</head>
<body>
  <div id="teacherBar" class="teacher-bar hidden"><div class="container"><span>وضع المعلم مفعّل</span><button class="btn btn-outline" id="btnLogout" type="button">تسجيل الخروج</button></div></div>
  <header class="site-header"><div class="container header-inner"><div class="brand"><div class="logo-fallback">م</div><div><h1>حصص الرياضيات</h1><small>حصة واحدة كل أسبوع</small></div></div><nav class="nav-actions"><span class="status-pill" id="fbStatus"><i></i> جاري</span><button class="btn btn-gold" id="btnTeacher" type="button">دخول المعلم</button></nav></div></header>
  <main>
    <section class="hero"><div class="container hero-content"><span class="eyebrow">بث داخل الصفحة</span><h2>حصص الرياضيات الأسبوعية</h2><p>الطالب يشاهد البث هنا بدون رابط ظاهر.</p>
      <div class="student-gate" id="studentGate"><label for="studentCode">رمز الحصة</label><div class="gate-row"><input id="studentCode" placeholder="أدخل الرمز" autocomplete="off" /><button class="btn btn-gold" id="btnStudentEnter" type="button">دخول</button></div><div class="msg" id="studentMsg"></div></div>
      <div class="hero-cta hidden" id="afterLoginCta"><button class="btn btn-outline" id="btnStudentOut" type="button">خروج الطالب</button></div>
    </div></section>
    <section class="section locked-area hidden" id="gradesSection"><div class="container"><div class="section-head"><div><h3>اختر الصف</h3></div></div><div class="grades-grid" id="gradesGrid"></div></div></section>
    <section class="section locked-area hidden" id="scheduleSection" style="padding-top:0"><div class="container"><div class="section-head"><div><h3>الحصة الأسبوعية</h3></div><button class="btn btn-gold hidden" id="btnAddClass" type="button">+ إضافة حصة</button></div>
      <div id="teacherScheduleHint" class="teacher-panel hidden"><h3>رموز الطلبة</h3><div id="codesEditor"></div><div class="msg" id="codesMsg"></div><button class="btn btn-teal" id="saveCodes" type="button">حفظ الرموز</button></div>
      <div class="week-list" id="weekGrid"></div>
      <p class="empty-note" id="weekEmpty">لا توجد حصة.</p>
    </div></section>
  </main>
  <footer><div class="container"><strong>حصص الرياضيات</strong></div></footer>
  <div class="modal-back hidden" id="classModal"><div class="modal modal-wide"><h3>إضافة حصة</h3>
    <div class="form-grid"><div><label for="classGrade">الصف</label><select id="classGrade"></select></div><div><label for="classDay">اليوم</label><select id="classDay"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></div>
    <div><label for="classStart">من</label><input id="classStart" type="time" value="08:00" /></div>
    <div><label for="classEnd">إلى</label><input id="classEnd" type="time" value="08:45" /></div></div>
    <label for="classTopic" style="margin-top:10px">الموضوع</label><input id="classTopic" />
    <label for="classPlace" style="margin-top:10px">رابط بث اليوتيوب</label><input id="classPlace" placeholder="https://youtu.be/..." />
    <label for="classNotes" style="margin-top:10px">ملاحظة</label><textarea id="classNotes" rows="2"></textarea>
    <div class="msg" id="classMsg"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="closeClassModal" type="button">إلغاء</button><button class="btn btn-gold" id="saveClass" type="button">حفظ</button></div>
  </div></div>
  <div class="modal-back hidden" id="teacherModal"><div class="modal"><h3>دخول المعلم</h3><p>123456</p><label for="teacherCode">الرقم</label><input id="teacherCode" type="password" /><div class="msg" id="loginMsg"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost" id="closeModal" type="button">إلغاء</button><button class="btn btn-gold" id="doLogin" type="button">دخول</button></div></div></div>
  <script src="js/content.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body></html>
